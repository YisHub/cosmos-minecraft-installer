name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Armar el paquete de traducciones
        run: python3 espanol/build.py
      - name: Compilar para Windows
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o Instalador-Cosmos-26.3.exe .
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Instalador-Cosmos-26.3.exe \
            --title "Cosmos 26.3 $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
